name: Build ExamOra APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip project if ExamOra.zip is uploaded
        run: |
          if [ -f ExamOra.zip ]; then
            rm -rf _project
            mkdir _project
            unzip -q ExamOra.zip -d _project
            echo "Unzipped ExamOra.zip"
          fi

      - name: Build debug APK
        run: |
          SETTINGS=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts nahi mila. ExamOra.zip upload hua ya nahi check karo."
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          pwd
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamOra-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
